apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-fp8
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    kueue.x-k8s.io/queue-name: reserved
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        args:
          - --port=8080
          - --model=Qwen/Qwen3.8-27B-FP8
          - --served-model-name=qwen-fp8
          - --max-model-len=32768
          - --default-chat-template-kwargs={"enable_thinking":false}
        env:
          - name: HF_HUB_OFFLINE
            value: "0"
          - name: TRANSFORMERS_OFFLINE
            value: "0"
          - name: HF_HOME
            value: /tmp/hf_home
        resources:
          requests:
            cpu: 4
            memory: 32Gi
            nvidia.com/mig-3g.71gb: 1
          limits:
            nvidia.com/mig-3g.71gb: 1
