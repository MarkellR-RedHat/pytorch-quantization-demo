apiVersion: apps/v1
kind: Deployment
metadata:
  name: pytorch-quantization-demo
  labels:
    app: pytorch-quantization-demo
spec:
  # One replica on purpose: metrics, votes and websocket fan-out live in process memory,
  # so a second replica would split the audience across two dashboards.
  replicas: 1
  selector:
    matchLabels:
      app: pytorch-quantization-demo
  template:
    metadata:
      labels:
        app: pytorch-quantization-demo
    spec:
      containers:
      - name: demo-app
        image: quay.io/your-org/pytorch-quantization-demo:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: OPENSHIFT_AI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: openshift-ai-config
              key: endpoint
        - name: OPENSHIFT_AI_TOKEN
          valueFrom:
            secretKeyRef:
              name: openshift-ai-config
              key: token
        - name: PRESENTER_KEY
          valueFrom:
            secretKeyRef:
              name: openshift-ai-config
              key: presenter_key
        - name: MODEL_FP16_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: model-endpoints
              key: fp16_endpoint
        - name: MODEL_INT4_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: model-endpoints
              key: int4_endpoint
        - name: MODEL_SPEC_DECODE_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: model-endpoints
              key: spec_decode_endpoint
        - name: MODEL_FP8_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: model-endpoints
              key: fp8_endpoint
              optional: true
        - name: TRUST_PROXY
          value: "true"
        - name: SIMULATION_MODE
          value: "false"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
