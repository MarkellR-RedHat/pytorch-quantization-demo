apiVersion: apps/v1
kind: Deployment
metadata:
  name: pytorch-quantization-demo
  labels:
    app: pytorch-quantization-demo
spec:
  # One replica on purpose: metrics and websocket fan-out live in process memory,
  # so a second replica would split the presenter screen's metrics across two pods.
  replicas: 1
  selector:
    matchLabels:
      app: pytorch-quantization-demo
  template:
    metadata:
      labels:
        app: pytorch-quantization-demo
    spec:
      containers:
        - name: app
          image: quay.io/<your-org>/pytorch-quantization-demo:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pytorch-quantization-demo
            - secretRef:
                name: pytorch-quantization-demo
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
