# FP8, Red Hat's build, one GPU. Startup log: bench/raw/2026-09-29-r2/logs/benchmark-fp8-*-startup.txt
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: benchmark-fp8
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:dd65c7ed88a9369b962f1299ed19c6c8819ff0a64595c10e32f1e82ab0750e27
        args:
          - --port=8080
          - --model=RedHatAI/Meta-Llama-3.1-70B-Instruct-FP8
          - --served-model-name=benchmark-fp8
          - --max-model-len=131072
        env:
          - name: HF_HOME
            value: /tmp/hf_home
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
        resources:
          requests:
            cpu: 8
            memory: 64Gi
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
