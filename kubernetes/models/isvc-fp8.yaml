# FP8: Red Hat's W8A8 build on one GPU. Measured footprint: 67.7 GiB (72.7 GB) of weights, which is
# more than a 71 GB MIG slice holds before any KV cache, so this one needs a full H200 (182K tokens of
# KV cache left on it). Hopper or newer, for the FP8 tensor cores.
# --max-model-len 131072 is what was measured (the model's full context); 32768 is plenty for a demo
# and leaves more of the GPU for KV cache. --port 8080 because KServe expects the predictor there
# and vLLM's default is 8000.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: benchmark-fp8
  namespace: <your-namespace>
  annotations:
    # Plain Deployment behind a Service, no Knative; drop it if your KServe defaults to raw already.
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    # Our cluster hands out GPUs through Kueue; drop this label if yours doesn't.
    kueue.x-k8s.io/queue-name: reserved
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:dd65c7ed88a9369b962f1299ed19c6c8819ff0a64595c10e32f1e82ab0750e27
        args:
          - --model=RedHatAI/Meta-Llama-3.1-70B-Instruct-FP8
          - --served-model-name=benchmark-fp8
          - --tensor-parallel-size=1
          - --dtype=bfloat16
          - --max-model-len=131072
          - --port=8080
        env:
          # the pod runs as a random UID, so the cache can't live under $HOME
          - name: HF_HOME
            value: /tmp/hf_home
          # Llama 3.1 is gated on the Hub
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
        resources:
          requests:
            cpu: 4
            memory: 48Gi
            nvidia.com/gpu: 1
          limits:
            cpu: 8
            memory: 96Gi
            nvidia.com/gpu: 1
