apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: benchmark-fp8
  namespace: <your-namespace>
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    kueue.x-k8s.io/queue-name: reserved
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:dd65c7ed88a9369b962f1299ed19c6c8819ff0a64595c10e32f1e82ab0750e27
      args:
      - "--port=8080"
      - "--model=RedHatAI/Meta-Llama-3.1-70B-Instruct-FP8"
      - "--served-model-name=benchmark-fp8"
      - "--tensor-parallel-size=1"
      - "--dtype=bfloat16"
      - "--max-model-len=131072"
      env:
      - name: HF_HOME
        value: /tmp/hf_home
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-token
            key: HF_TOKEN
      - name: HF_HUB_OFFLINE
        value: "0"
      - name: TRANSFORMERS_OFFLINE
        value: "0"
      ports:
      - containerPort: 8080
        protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
          memory: 64Gi
          cpu: "8"
