# Qwen track, Red Hat's INT4 build (W4A16, GPTQ via LLM Compressor) on a 71 GB MIG slice, the same profile as FP8 (17.7 GiB loaded, CUDA graphs). vLLM 0.24.0+rhaiv.13, thinking off server-side. Startup log: bench/raw/2026-09-30-qwen-r1/logs/qwen-int4-predictor-*-startup.txt
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-int4
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        args:
          - --port=8080
          - --model=RedHatAI/Qwen3.8-27B-INT4
          - --served-model-name=qwen-int4
          - --max-model-len=32768
          - --default-chat-template-kwargs={"enable_thinking":false}
        env:
          - name: HF_HUB_OFFLINE
            value: "0"
          - name: TRANSFORMERS_OFFLINE
            value: "0"
          - name: HF_HOME
            value: /tmp/hf_home
        resources:
          requests:
            cpu: 4
            memory: 32Gi
            nvidia.com/mig-3g.71gb: 1
          limits:
            nvidia.com/mig-3g.71gb: 1
