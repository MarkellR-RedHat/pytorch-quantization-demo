# Qwen track, Qwen's own FP8 build on a 71 GB MIG slice. vLLM 0.24.0+rhaiv.13.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-fp8
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        args:
          - --port=8080
          - --model=Qwen/Qwen3.8-27B-FP8
          - --served-model-name=qwen-fp8
          - --max-model-len=32768
        env:
          - name: HF_HOME
            value: /tmp/hf_home
        resources:
          requests:
            cpu: 4
            memory: 32Gi
            nvidia.com/mig-3g.71gb: 1
          limits:
            nvidia.com/mig-3g.71gb: 1
