# Qwen track, the same INT4 build on a 35 GB MIG slice (three per H200), in eager mode: CUDA-graph memory profiling fails on that slice with an NVML assertion, so the pod ran with --enforce-eager (it is in the pod's args in bench/raw/2026-09-30-qwen-r1/logs/qwen-int4-35gb-predictor-*-startup.txt; the delivered export of the manifest predates the flag). vLLM 0.24.0+rhaiv.13, thinking off server-side.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-int4-35gb
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        args:
          - --port=8080
          - --model=RedHatAI/Qwen3.8-27B-INT4
          - --served-model-name=qwen-int4-35gb
          - --max-model-len=32768
          - --default-chat-template-kwargs={"enable_thinking":false}
          - --enforce-eager
        env:
          - name: HF_HUB_OFFLINE
            value: "0"
          - name: TRANSFORMERS_OFFLINE
            value: "0"
          - name: HF_HOME
            value: /tmp/hf_home
        resources:
          requests:
            cpu: 4
            memory: 32Gi
            nvidia.com/mig-2g.35gb: 1
          limits:
            nvidia.com/mig-2g.35gb: 1
