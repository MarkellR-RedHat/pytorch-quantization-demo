# Qwen track, speculative decoding with the model's own MTP head, same full H200 as BF16. vLLM 0.24.0+rhaiv.13.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-mtp
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        args:
          - --port=8080
          - --model=Qwen/Qwen3.8-27B
          - --served-model-name=qwen-mtp
          - --max-model-len=32768
          - --spec-method=mtp
          - --spec-tokens=4
        env:
          - name: HF_HOME
            value: /tmp/hf_home
        resources:
          requests:
            cpu: 4
            memory: 32Gi
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
