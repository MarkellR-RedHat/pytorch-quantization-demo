# Qwen track, BF16 reference on one full H200. vLLM 0.24.0+rhaiv.13 (MTP needs it; the Llama track ran on 0.18).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-bf16
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        args:
          - --port=8080
          - --model=Qwen/Qwen3.8-27B
          - --served-model-name=qwen-bf16
          - --max-model-len=32768
        env:
          - name: HF_HOME
            value: /tmp/hf_home
        resources:
          requests:
            cpu: 4
            memory: 32Gi
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
