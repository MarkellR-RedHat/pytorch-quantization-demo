# INT4, the community AWQ build, one GPU. Startup log: bench/raw/2026-09-29-r2/logs/benchmark-int4-*-startup.txt Runtime: kubernetes/servingruntime-vllm.yaml; the hf:// download needs kubernetes/storage-config.example.yaml.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: benchmark-int4
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-gpu-benchmark
      storageUri: hf://hugging-quants/Meta-Llama-3.1-70B-Instruct-AWQ-INT4
      resources:
        requests:
          cpu: 4
          memory: 48Gi
          nvidia.com/gpu: 1
        limits:
          nvidia.com/gpu: 1
