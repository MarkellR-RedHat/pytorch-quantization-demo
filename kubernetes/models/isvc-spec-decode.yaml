# Speculative decoding, BF16 70B target with an 8B draft, TP2. Startup log: bench/raw/2026-09-29-r2/logs/benchmark-spec-*-startup.txt
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: benchmark-spec
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:dd65c7ed88a9369b962f1299ed19c6c8819ff0a64595c10e32f1e82ab0750e27
        args:
          - --port=8080
          - --model=meta-llama/Meta-Llama-3.1-70B-Instruct
          - --served-model-name=benchmark-spec
          - --tensor-parallel-size=2
          - --dtype=bfloat16
          - --max-model-len=131072
          - '--speculative-config={"model": "meta-llama/Llama-3.1-8B-Instruct", "num_speculative_tokens": 5}'
        env:
          - name: HF_HOME
            value: /tmp/hf_home
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: HF_TOKEN
        resources:
          requests:
            cpu: 8
            memory: 96Gi
            nvidia.com/gpu: 2
          limits:
            nvidia.com/gpu: 2
