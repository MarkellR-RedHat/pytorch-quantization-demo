# INT4, Red Hat's validated W4A16 build (GPTQ), one GPU. Startup log: bench/raw/2026-09-29-r2/logs/benchmark-int4-rh-*-startup.txt
# ServingRuntime not included yet; see README.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: benchmark-int4-rh
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-gpu-benchmark
      storageUri: hf://RedHatAI/Meta-Llama-3.1-70B-Instruct-quantized.w4a16
      resources:
        requests:
          cpu: 4
          memory: 48Gi
          nvidia.com/gpu: 1
        limits:
          nvidia.com/gpu: 1
