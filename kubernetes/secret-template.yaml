# Template for OpenShift AI credentials and the presenter key. Create the real secret with:
#   oc create secret generic openshift-ai-config \
#     --from-literal=endpoint=<url> --from-literal=token=<token> \
#     --from-literal=presenter_key=$(openssl rand -hex 16)

apiVersion: v1
kind: Secret
metadata:
  name: openshift-ai-config
type: Opaque
stringData:
  endpoint: "https://your-openshift-ai-endpoint.com"
  token: "your-api-token-here"
  presenter_key: "change-me"
