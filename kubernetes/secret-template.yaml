# Template for OpenShift AI credentials
# Create actual secret with: oc create secret generic openshift-ai-config --from-literal=endpoint=<url> --from-literal=token=<token>

apiVersion: v1
kind: Secret
metadata:
  name: openshift-ai-config
type: Opaque
stringData:
  endpoint: "https://your-openshift-ai-endpoint.com"
  token: "your-api-token-here"
