# Create the real one instead of applying this file:
#   oc create secret generic pytorch-quantization-demo \
#     --from-literal=PRESENTER_KEY=$(openssl rand -hex 16) \
#     --from-literal=OPENSHIFT_AI_TOKEN=<bearer token, only if the endpoints need one>
apiVersion: v1
kind: Secret
metadata:
  name: pytorch-quantization-demo
type: Opaque
stringData:
  PRESENTER_KEY: change-me
  OPENSHIFT_AI_TOKEN: ""
