<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyTorch Quantization Demo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="audience-view">
    <div class="container">
        <header>
            <h1>PyTorch Quantization Showdown</h1>
            <p class="subtitle">Interactive Stress Test on OpenShift AI</p>
        </header>

        <main>
            <div class="model-selector">
                <h2>Choose Your Model</h2>
                <div class="model-buttons">
                    <button class="model-btn" data-model="FP32">
                        <span class="model-name">FP32</span>
                        <span class="model-desc">Full Precision</span>
                    </button>
                    <button class="model-btn" data-model="FP16">
                        <span class="model-name">FP16</span>
                        <span class="model-desc">Half Precision</span>
                    </button>
                    <button class="model-btn" data-model="INT8">
                        <span class="model-name">INT8</span>
                        <span class="model-desc">8-bit Quantized</span>
                    </button>
                    <button class="model-btn" data-model="INT4">
                        <span class="model-name">INT4</span>
                        <span class="model-desc">Extreme Quantization</span>
                    </button>
                </div>
            </div>

            <div class="action-area">
                <button id="sendRequestBtn" class="send-btn" disabled>
                    <span class="btn-text">SEND REQUEST</span>
                    <span class="btn-subtext">Select a model first</span>
                </button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="yourRequests">0</div>
                    <div class="stat-label">Your Requests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalRequests">0</div>
                    <div class="stat-label">Total Requests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="participants">0</div>
                    <div class="stat-label">Participants</div>
                </div>
            </div>

            <div class="status-message" id="statusMessage"></div>
        </main>

        <footer>
            <p>Powered by OpenShift AI | Red Hat</p>
        </footer>
    </div>

    <script src="/static/js/audience.js"></script>
</body>
</html>
