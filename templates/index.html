<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantization Showdown</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="audience-view">
    <div class="container">
        <header>
            <h1>Quantization Showdown</h1>
            <p class="subtitle">Stress test PyTorch inference optimization</p>
        </header>

        <main>
            <div class="model-selector">
                <h2>Pick a Variant</h2>
                <div class="model-buttons three-buttons">
                    <button class="model-btn selected" data-model="FP16">
                        <span class="model-name">FP16</span>
                        <span class="model-desc">Half Precision — Quality baseline</span>
                    </button>
                    <button class="model-btn" data-model="INT4">
                        <span class="model-name">INT4</span>
                        <span class="model-desc">4-bit — Fast but lossy</span>
                    </button>
                    <button class="model-btn" data-model="SPEC_DECODE">
                        <span class="model-name">Spec Decode</span>
                        <span class="model-desc">Draft + verify — Best of both</span>
                    </button>
                </div>
            </div>

            <div class="action-area">
                <button id="sendRequestBtn" class="send-btn">
                    <span class="btn-text">TAP TO SEND</span>
                    <span class="btn-subtext" id="btnSubtext">FP16 selected — Tap away!</span>
                </button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="yourRequests">0</div>
                    <div class="stat-label">Your Requests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalRequests">0</div>
                    <div class="stat-label">Total Requests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="participants">0</div>
                    <div class="stat-label">Participants</div>
                </div>
            </div>

            <div class="status-message" id="statusMessage"></div>
        </main>

        <footer>
            <p>Powered by vLLM + LLM Compressor | Red Hat</p>
        </footer>
    </div>

    <script src="/static/js/audience.js"></script>
</body>
</html>
