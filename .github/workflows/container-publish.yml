name: Publish Container Image

# The backup image for the OpenShift Route (kubernetes/deployment.yaml pins the 2026.10 tag).
#   gh workflow run container-publish.yml --ref main -f tag=2026.10
# Pushing a v* tag publishes it under that tag too. The package has to be public once in GitHub
# (Packages, the package, settings, Change visibility), or the cluster needs a pull secret.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        required: true
        default: "2026.10"
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      env:
        IMAGE: ghcr.io/markellr-redhat/pytorch-quantization-demo
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        docker build --platform linux/amd64 -t "$IMAGE:$TAG" -t "$IMAGE:${GITHUB_SHA::7}" .
        docker push "$IMAGE:$TAG"
        docker push "$IMAGE:${GITHUB_SHA::7}"
        docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" || true
