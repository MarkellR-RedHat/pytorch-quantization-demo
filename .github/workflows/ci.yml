name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests with coverage
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term


  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.6.9

    - name: Lint with ruff
      run: |
        ruff check app tests scripts

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build container image
      run: |
        docker build -t pytorch-quantization-demo:${{ github.sha }} .

    - name: Test container runs
      run: |
        docker run -d --name demo -p 8000:8000 -e SIMULATION_MODE=true pytorch-quantization-demo:${{ github.sha }}
        for i in $(seq 1 30); do
          curl --silent --fail http://localhost:8000/health && exit 0
          sleep 1
        done
        docker logs demo
        exit 1
